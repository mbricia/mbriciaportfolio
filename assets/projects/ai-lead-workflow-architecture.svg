<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <rect width="1600" height="920" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#0f172a">Client Inquiry Automation Workflow</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="20" fill="#475569">Validate → deduplicate → extract → score → respond → route → monitor</text>

  <g font-family="Arial, sans-serif">
    <rect x="55" y="150" width="280" height="650" rx="24" fill="#e8f3ff"/>
    <text x="85" y="195" font-size="24" font-weight="700" fill="#1d4ed8">1. INTAKE</text>

    <rect x="90" y="230" width="210" height="74" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="195" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Webhook</text>
    <text x="195" y="286" text-anchor="middle" font-size="15" fill="#64748b">Receive inquiry</text>

    <line x1="195" y1="304" x2="195" y2="340" stroke="#64748b" stroke-width="3"/>
    <polygon points="195,350 188,338 202,338" fill="#64748b"/>

    <rect x="90" y="350" width="210" height="74" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="195" y="380" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Normalize</text>
    <text x="195" y="406" text-anchor="middle" font-size="15" fill="#64748b">Clean request data</text>

    <line x1="195" y1="424" x2="195" y2="460" stroke="#64748b" stroke-width="3"/>
    <polygon points="195,470 188,458 202,458" fill="#64748b"/>

    <rect x="90" y="470" width="210" height="86" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="195" y="501" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Validate</text>
    <text x="195" y="527" text-anchor="middle" font-size="15" fill="#64748b">Required fields + email</text>

    <line x1="150" y1="556" x2="150" y2="605" stroke="#ef4444" stroke-width="3"/>
    <polygon points="150,615 143,603 157,603" fill="#ef4444"/>
    <text x="122" y="583" font-size="14" fill="#b91c1c">Invalid</text>

    <rect x="78" y="615" width="144" height="100" rx="14" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="150" y="646" text-anchor="middle" font-size="16" font-weight="700" fill="#9f1239">Log Invalid</text>
    <text x="150" y="670" text-anchor="middle" font-size="14" fill="#64748b">Audit trail</text>
    <text x="150" y="695" text-anchor="middle" font-size="14" fill="#9f1239">HTTP 400</text>

    <line x1="240" y1="513" x2="350" y2="513" stroke="#10b981" stroke-width="3"/>
    <polygon points="360,513 348,506 348,520" fill="#10b981"/>
    <text x="284" y="500" font-size="14" fill="#047857">Valid</text>

    <rect x="360" y="150" width="290" height="650" rx="24" fill="#fff6e8"/>
    <text x="390" y="195" font-size="24" font-weight="700" fill="#b45309">2. PROTECTION</text>

    <rect x="400" y="230" width="210" height="74" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="505" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Add Metadata</text>
    <text x="505" y="286" text-anchor="middle" font-size="15" fill="#64748b">ID · timestamp · dedupe key</text>

    <line x1="505" y1="304" x2="505" y2="340" stroke="#64748b" stroke-width="3"/>
    <polygon points="505,350 498,338 512,338" fill="#64748b"/>

    <rect x="400" y="350" width="210" height="74" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="505" y="380" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Check Existing Lead</text>
    <text x="505" y="406" text-anchor="middle" font-size="15" fill="#64748b">Google Sheets lookup</text>

    <line x1="505" y1="424" x2="505" y2="460" stroke="#64748b" stroke-width="3"/>
    <polygon points="505,470 498,458 512,458" fill="#64748b"/>

    <rect x="400" y="470" width="210" height="86" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="505" y="501" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Duplicate?</text>
    <text x="505" y="527" text-anchor="middle" font-size="15" fill="#64748b">Compare dedupe key</text>

    <line x1="455" y1="556" x2="455" y2="605" stroke="#ef4444" stroke-width="3"/>
    <polygon points="455,615 448,603 462,603" fill="#ef4444"/>
    <rect x="390" y="615" width="130" height="90" rx="14" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="455" y="648" text-anchor="middle" font-size="16" font-weight="700" fill="#9f1239">Duplicate</text>
    <text x="455" y="675" text-anchor="middle" font-size="14" fill="#9f1239">HTTP 200</text>

    <line x1="555" y1="556" x2="675" y2="556" stroke="#10b981" stroke-width="3"/>
    <polygon points="685,556 673,549 673,563" fill="#10b981"/>

    <rect x="675" y="150" width="300" height="650" rx="24" fill="#f0ebff"/>
    <text x="705" y="195" font-size="24" font-weight="700" fill="#6d28d9">3. AI + SCORING</text>

    <rect x="720" y="230" width="210" height="82" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="825" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">AI Extraction</text>
    <text x="825" y="286" text-anchor="middle" font-size="15" fill="#64748b">Project · budget · timeline</text>

    <line x1="825" y1="312" x2="825" y2="350" stroke="#64748b" stroke-width="3"/>
    <polygon points="825,360 818,348 832,348" fill="#64748b"/>

    <rect x="720" y="360" width="210" height="74" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="825" y="391" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Build Lead Record</text>
    <text x="825" y="416" text-anchor="middle" font-size="15" fill="#64748b">Structured data</text>

    <line x1="825" y1="434" x2="825" y2="470" stroke="#64748b" stroke-width="3"/>
    <polygon points="825,480 818,468 832,468" fill="#64748b"/>

    <rect x="720" y="480" width="210" height="88" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="825" y="511" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Lead Score</text>
    <text x="825" y="537" text-anchor="middle" font-size="15" fill="#64748b">Rule-based 0–100</text>
    <text x="825" y="557" text-anchor="middle" font-size="14" fill="#6d28d9">Hot · Warm · Cold</text>

    <line x1="825" y1="568" x2="825" y2="606" stroke="#64748b" stroke-width="3"/>
    <polygon points="825,616 818,604 832,604" fill="#64748b"/>

    <rect x="720" y="616" width="210" height="78" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="825" y="647" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Log Lead</text>
    <text x="825" y="675" text-anchor="middle" font-size="15" fill="#64748b">Google Sheets</text>

    <line x1="930" y1="655" x2="995" y2="655" stroke="#10b981" stroke-width="3"/>
    <polygon points="1005,655 993,648 993,662" fill="#10b981"/>

    <rect x="1005" y="150" width="300" height="650" rx="24" fill="#eafff3"/>
    <text x="1035" y="195" font-size="24" font-weight="700" fill="#047857">4. COMMUNICATION</text>

    <rect x="1050" y="230" width="210" height="82" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="1155" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">HTTP 202</text>
    <text x="1155" y="286" text-anchor="middle" font-size="15" fill="#64748b">Inquiry accepted</text>

    <rect x="1050" y="350" width="210" height="82" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="1155" y="380" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">AI Client Reply</text>
    <text x="1155" y="406" text-anchor="middle" font-size="15" fill="#64748b">Personalized response</text>

    <line x1="1155" y1="432" x2="1155" y2="470" stroke="#64748b" stroke-width="3"/>
    <polygon points="1155,480 1148,468 1162,468" fill="#64748b"/>

    <rect x="1050" y="480" width="210" height="82" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="1155" y="511" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Send Client Email</text>
    <text x="1155" y="537" text-anchor="middle" font-size="15" fill="#64748b">Gmail</text>

    <rect x="1040" y="620" width="92" height="75" rx="12" fill="#fee2e2"/>
    <text x="1086" y="650" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Hot</text>
    <text x="1086" y="676" text-anchor="middle" font-size="13" fill="#64748b">Alert</text>
    <rect x="1140" y="620" width="92" height="75" rx="12" fill="#fef3c7"/>
    <text x="1186" y="650" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Warm</text>
    <text x="1186" y="676" text-anchor="middle" font-size="13" fill="#64748b">Wait + remind</text>
    <rect x="1240" y="620" width="92" height="75" rx="12" fill="#dbeafe"/>
    <text x="1286" y="650" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">Cold</text>
    <text x="1286" y="676" text-anchor="middle" font-size="13" fill="#64748b">Nurture</text>

    <rect x="1330" y="150" width="215" height="650" rx="24" fill="#fff0f3"/>
    <text x="1360" y="195" font-size="24" font-weight="700" fill="#be123c">5. ERROR HANDLING</text>

    <rect x="1360" y="260" width="155" height="84" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="1437" y="291" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Catch Failure</text>
    <text x="1437" y="318" text-anchor="middle" font-size="14" fill="#64748b">Error Trigger</text>

    <line x1="1437" y1="344" x2="1437" y2="390" stroke="#64748b" stroke-width="3"/>
    <polygon points="1437,400 1430,388 1444,388" fill="#64748b"/>

    <rect x="1360" y="400" width="155" height="84" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="1437" y="431" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Build Alert</text>
    <text x="1437" y="458" text-anchor="middle" font-size="14" fill="#64748b">Normalize error</text>

    <line x1="1437" y1="484" x2="1437" y2="530" stroke="#64748b" stroke-width="3"/>
    <polygon points="1437,540 1430,528 1444,528" fill="#64748b"/>

    <rect x="1360" y="540" width="155" height="90" rx="14" fill="white" stroke="#cbd5e1"/>
    <text x="1437" y="572" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Failure Email</text>
    <text x="1437" y="600" text-anchor="middle" font-size="14" fill="#64748b">Execution link</text>
  </g>

  <rect x="55" y="835" width="1490" height="48" rx="16" fill="#0f172a"/>
  <text x="800" y="866" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white">n8n · OpenAI · Google Sheets · Gmail · JavaScript · Webhooks</text>
</svg>