name: Portfolio QA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: Run regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run portfolio QA
        shell: bash
        run: |
          set -euo pipefail
          for test_file in qa/test_*.py; do
            echo "::group::$test_file"
            python "$test_file"
            echo "::endgroup::"
          done
